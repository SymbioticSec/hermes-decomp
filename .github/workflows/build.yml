name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace

      # The round trip corpus is built locally from the tracked snippets by
      # scripts/build/fetch_hermesc.sh then build_corpus.sh, and the toolchains
      # it downloads are too large to pull on every run. The handful of tests
      # that read a compiled fixture opt out here and stay a local gate.
      - name: Run tests
        env:
          HBC_CORPUS_OPTIONAL: "1"
        run: cargo test --workspace --release

      - name: Collect binaries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/hermes-decomp dist/
          cp target/release/hermes-mcp dist/

      - name: Collect binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/hermes-decomp.exe dist/
          cp target/release/hermes-mcp.exe dist/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: hermes-decomp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
